name: Notify bman-platform

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # Skip echo from inbound platform → static sync commits.
    if: ${{ !contains(github.event.head_commit.message, '[content-sync]') }}
    steps:
      - name: Trigger marketing content sync on bman-platform
        env:
          GH_TOKEN: ${{ secrets.BMAN_PLATFORM_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "BMAN_PLATFORM_DISPATCH_TOKEN is not set" >&2
            exit 1
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/seanbman/bman-platform/dispatches \
            -d "{\"event_type\":\"sync-marketing-content\",\"client_payload\":{\"sha\":\"${GITHUB_SHA}\",\"ref\":\"${GITHUB_REF}\"}}"
